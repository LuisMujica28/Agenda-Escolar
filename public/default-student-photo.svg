<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Background -->
  <rect width="120" height="120" rx="16" fill="#F1F5F9"/>
  <!-- Border -->
  <rect width="118" height="118" x="1" y="1" rx="15" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 3"/>
  
  <!-- Student silhouette -->
  <g fill="#94A3B8">
    <!-- Head -->
    <circle cx="60" cy="40" r="18" />
    <!-- Shoulders -->
    <path d="M 30 84 C 30 66, 42 60, 60 60 C 78 60, 90 66, 90 84 Z" />
  </g>

  <!-- Camera badge overlay -->
  <g transform="translate(64, 58)">
    <circle cx="16" cy="16" r="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="12" fill="#3B82F6"/>
    <!-- Camera icon inside badge -->
    <path d="M10.5 13.5 h2.2 l0.9 -1.6 h4.8 l0.9 1.6 h2.2 a1.8 1.8 0 0 1 1.8 1.8 v5.8 a1.8 1.8 0 0 1 -1.8 1.8 h-11 a1.8 1.8 0 0 1 -1.8 -1.8 v-5.8 a1.8 1.8 0 0 1 1.8 -1.8 z" fill="#FFFFFF"/>
    <circle cx="16" cy="17.8" r="2.6" fill="#3B82F6"/>
    <circle cx="16" cy="17.8" r="1.3" fill="#FFFFFF"/>
  </g>

  <!-- 'FOTO' text label badge -->
  <g transform="translate(38, 92)">
    <rect width="44" height="16" rx="4" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
    <text x="22" y="11.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#475569" letter-spacing="1">FOTO</text>
  </g>
</svg>
